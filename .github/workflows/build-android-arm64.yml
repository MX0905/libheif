name: build-android-bionic-arm64-libheif

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to checkout (branch/tag/commit)"
        required: false
        default: "main"

jobs:
  build-android-bionic-arm64-libheif:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}

      # 1. 下载配置 Android NDK r27c
      - name: Setup Android NDK
        shell: pwsh
        run: |
          Invoke-WebRequest "https://dl.google.com/android/repository/android-ndk-r27c-windows.zip" -OutFile ndk.zip
          Expand-Archive ndk.zip ./ndk
          $env:NDK_ROOT = "$(Get-Location)/ndk/android-ndk-r27c"
          echo "NDK_ROOT=$env:NDK_ROOT" >> $env:GITHUB_ENV
          $clangPath = "$env:NDK_ROOT/toolchains/llvm/prebuilt/windows-x86_64/bin"
          echo "$clangPath" >> $env:GITHUB_PATH

      # 2. 安装 cmake（ninja 已预装，不再重复）
      - name: Install build tools
        run: choco install cmake --yes

      # 3. 缓存依赖（第二次起秒过）
      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps-src
            /data/local/arm64
          key: android-deps-v2-${{ hashFiles('build_deps_android_arm64.sh') }}
          restore-keys: android-deps-v2-

      # 4. 批量静态编译所有依赖库
      - name: Build all static codec deps
        run: bash ./build_deps_android_arm64.sh
        env:
          NDK_ROOT: ${{ env.NDK_ROOT }}

      # 5. CMake 编译 libheif + 全内置工具
      - name: Build libheif static tools
        run: |
          mkdir build-android
          cd build-android
          cmake .. -G Ninja `
            -DCMAKE_SYSTEM_NAME=Android `
            -DCMAKE_SYSTEM_VERSION=24 `
            -DCMAKE_ANDROID_ARCH_ABI=arm64-v8a `
            -DCMAKE_ANDROID_NDK=$env:NDK_ROOT `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH=/data/local/arm64 `
            -DBUILD_SHARED_LIBS=OFF `
            -DCMAKE_EXE_LINKER_FLAGS="-static -static-libgcc -static-libstdc++" `
            -DENABLE_PLUGINS=OFF `
            -DWITH_X265=ON -DWITH_AOM_ENCODER=ON -DWITH_X264=ON -DWITH_VVENC=ON `
            -DWITH_OPENJPEG=ON -DWITH_OPENJPH=ON -DWITH_LIBJPEG=ON `
            -DWITH_LIBDE265=ON -DWITH_AOM_DECODER=ON -DWITH_VVDEC=ON -DWITH_OPENH264=ON `
            -DWITH_LIBPNG=ON -DWITH_ZLIB=ON -DWITH_LIBTIFF=ON -DWITH_LIBWEBP=ON `
            -DWITH_BROTLI=ON -DWITH_DEFLATE=ON -DWITH_LZMA=ON -DWITH_ZSTD=ON
          ninja -j4

      # 6. Strip 去符号
      - name: Strip binaries
        run: |
          $strip = "$env:NDK_ROOT/toolchains/llvm/prebuilt/windows-x86_64/bin/llvm-strip"
          & $strip --strip-all build-android/tools/heif-enc.exe
          & $strip --strip-all build-android/tools/heif-dec.exe
          & $strip --strip-all build-android/tools/heif-view.exe

      # 7. 提取输出二进制
      - name: Collect binaries
        run: |
          mkdir artifact-android-arm64
          cp build-android/tools/heif-enc artifact-android-arm64/
          cp build-android/tools/heif-dec artifact-android-arm64/
          cp build-android/tools/heif-view artifact-android-arm64/

      # 8. 打包 tar.gz
      - name: Package android-bionic-arm64 tarball
        run: |
          cd artifact-android-arm64
          tar -czvf ../libheif-full_android-bionic-arm64.tar.gz heif-enc heif-dec heif-view

      # 9. 上传制品
      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: libheif-android-bionic-arm64
          path: libheif-full_*.tar.gz
